[project]
name = "examshield"
version = "0.1.0"
description = "시험 문서 AI 판독 저항 CLI: 내용은 그대로 둔 복사본을 만들고 저항 효과를 수치로 측정한다"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pymupdf>=1.24",
  "pikepdf>=9",
  "fonttools>=4.50",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pillow>=10",
  "pyyaml>=6",
  "keyring>=25",
]

[project.optional-dependencies]
cloud = ["openai>=1.40", "anthropic>=0.40", "google-genai>=1.0"]

[project.scripts]
examshield = "examshield.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["examshield"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S110", "T20", "PLC0415"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
"examshield/cli.py" = ["B008"]
"examshield/verify/models/*.py" = ["PLC0415"]
"examshield/auth/keys.py" = ["PLC0415"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["examshield"]

[[tool.mypy.overrides]]
module = ["fitz", "pymupdf", "cv2", "keyring", "keyring.*", "openai", "anthropic", "google", "google.*", "pikepdf", "fontTools.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
markers = ["slow: 전체 verify 실행처럼 오래 걸리는 테스트"]
