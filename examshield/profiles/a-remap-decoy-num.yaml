name: a-remap-decoy-num
scenario: A
status: experimental
description: a-remap-decoy와 같지만 숫자는 섞지 않는다. 복사하거나 추출한 텍스트에서 문항 번호가 그대로 읽혀서, 문항 번호를 말하는 미끼(정답표에 문항 번호를 적었을 때)가 제 문항에 맞아떨어진다. 대신 본문의 숫자(연도, 수치)도 그대로 읽힌다. Claude로 한 번 재 보니 미끼를 따른 문항이 36문항 중 17, 정답률이 19.4%였다(2026-11-21). 숫자를 섞는 쪽은 두 번 재서 4와 16이 나왔으므로, 미끼를 더 따르는지는 알 수 없다. 정답률은 숫자를 섞을 때(5.6%)보다 높았다. 화면 캡처나 파일 올리기로 읽는 AI는 막지 못한다.
blocks: [text]
techniques:
  - id: glyph_remap
    params:
      keep: [digit]
  - id: decoy
